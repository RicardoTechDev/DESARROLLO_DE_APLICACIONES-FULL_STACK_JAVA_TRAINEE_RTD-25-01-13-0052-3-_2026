<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio Web</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Partículas de Fondo -->
    <div id="particles-js" class="position-absolute w-100 h-100" style="z-index: -1; top: 0; left: 0;"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white bg-opacity-75 fixed-top shadow-sm backdrop-blur">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="#">
                <i class="fas fa-laptop-code text-dark me-2"></i>TuNombre
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav fw-semibold">
                    <li class="nav-item"><a class="nav-link active" style="color: #4b0082; border-bottom: 2px solid #4b0082;" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#skills">Skills</a></li>
                    <li class="nav-item"><a class="nav-link" href="#education">Education</a></li>
                    <li class="nav-item"><a class="nav-link" href="#work">Work</a></li>
                    <li class="nav-item"><a class="nav-link" href="#experience">Experience</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero-section vh-100 d-flex align-items-center mt-5">
        <div class="container">
            <div class="row align-items-center">
                <!-- Text Content -->
                <div class="col-lg-6 z-index-1">
                    <h2 class="fw-bold text-dark mb-2" style="font-size: 3rem;">Hi There,</h2>
                    <h1 class="fw-bold text-dark mb-3" style="font-size: 3.5rem;">I'm <span style="color: #ff8c00;">Tu Nombre</span></h1>
                    
                    <h3 class="fw-semibold mb-4 d-flex align-items-center" style="font-size: 1.8rem;">
                        I Am Into <span class="ms-2" style="color: #800000;">
                            <span class="typewrite" data-period="2000" data-type='[ "Web Development", "Frontend Development", "Backend Development", "UI/UX Design" ]'>
                                <span class="wrap"></span>
                            </span>
                        </span>
                    </h3>
                    
                    <a href="#about" class="btn rounded-pill px-4 py-2 mb-4 d-inline-flex align-items-center shadow-lg text-white" style="background-color: #00004d; border: none; font-weight: 500;">
                        About Me <i class="fas fa-arrow-circle-down ms-2"></i>
                    </a>
                    
                    <!-- Social Icons -->
                    <div class="social-links mt-3">
                        <a href="#" class="social-icon bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center me-2 shadow-sm"><i class="fab fa-linkedin-in"></i></a>
                        <a href="#" class="social-icon bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center me-2 shadow-sm"><i class="fab fa-github"></i></a>
                        <a href="#" class="social-icon bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center me-2 shadow-sm"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="social-icon bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center me-2 shadow-sm"><i class="fab fa-telegram-plane"></i></a>
                        <a href="#" class="social-icon bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center me-2 shadow-sm"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="social-icon bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm"><i class="fab fa-dev"></i></a>
                    </div>
                </div>
                
                <!-- Avatar Content -->
                <div class="col-lg-6 text-center mt-5 mt-lg-0 z-index-1">
                    <div class="avatar-container d-inline-block position-relative rounded-circle shadow-lg" 
                         style="background-color: #ffcc00; width: 380px; height: 380px; display: flex !important; align-items: flex-end; justify-content: center; overflow: hidden; margin: 0 auto; border: 10px solid rgba(255, 204, 0, 0.3);">
                        <!-- Usando un avatar de ejemplo similar al de la imagen -->
                        <img src="https://avataaars.io/?avatarStyle=Transparent&topType=ShortHairShortFlat&accessoriesType=Blank&hairColor=BrownDark&facialHairType=BeardLight&facialHairColor=BrownDark&clotheType=ShirtCrewNeck&clotheColor=PastelBlue&eyeType=Happy&eyebrowType=DefaultNatural&mouthType=Smile&skinColor=Light" 
                             alt="Avatar" class="img-fluid" style="width: 320px; position: absolute; bottom: -20px; z-index: 2;">
                        
                        <!-- Mano saludando (simulada con un emoji o icono para simplificar, idealmente en la imagen real estaría integrada) -->
                        <div style="position: absolute; right: 40px; top: 150px; font-size: 50px; z-index: 3; transform: rotate(15deg);">👋</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Particles.js Library -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
