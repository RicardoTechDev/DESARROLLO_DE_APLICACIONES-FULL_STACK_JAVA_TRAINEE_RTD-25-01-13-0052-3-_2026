spring.application.name=springedumanager_2
spring.mvc.hiddenmethod.filter.enabled=true

# =====================================================
# MYSQL
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/springedumanager
spring.datasource.username=root
spring.datasource.password=


# =====================================================
# JPA / HIBERNATE
# =====================================================

# Permite que Hibernate cree o actualice
# la estructura de las tablas.
spring.jpa.hibernate.ddl-auto=update


# Permite visualizar SQL generado por Hibernate.
spring.jpa.show-sql=true


# Formatea las consultas mostradas en consola.
spring.jpa.properties.hibernate.format_sql=true