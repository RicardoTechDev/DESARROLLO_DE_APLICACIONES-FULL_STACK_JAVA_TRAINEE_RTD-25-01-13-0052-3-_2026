<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
    th:fragment="layout(titulo, contenido, scripts)">
<!-- 
Estamos creando una especie de plantilla reutilizable llamada layout
que necesita dos datos titulo y contenido

Entonces nuestro archivo base se encarga de:
navbar
Bootstrap
Font Awesome
footer
estructura HTML
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <!--
        El título lo recibiremos desde
        cada página.
    -->
    <title th:text="${titulo} + ' | SpringEduManager'">
        SpringEduManager
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body class="d-flex flex-column min-vh-100">
    <!-- ========================================= -->
    <!-- BARRA DE NAVEGACIÓN                      -->
    <!-- ========================================= -->
    <nav class="navbar navbar-expand-lg bg-dark text-bg-dark mb-4" data-bs-theme="dark">
        <div class="container">
            <!-- Nombre del sistema -->
            <a class="navbar-brand"
               th:href="@{/}">
                Sistema de gestión académica
            </a>

            <!-- Botón responsive -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarPrincipal"
                    aria-controls="navbarPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarPrincipal">
                <!-- Navegación -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/home}">
                            Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/estudiantes/listar}">
                            Estudiantes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/cursos/listar}">
                            Cursos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/evaluaciones}">
                            Evaluaciones
                        </a>
                    </li>
                </ul>
                
                <!-- Usuario -->
                <div class="d-flex align-items-center">
                    <span class="me-3">
                        Hola,
                        <strong>
                            <!--
                                Más adelante colocaremos
                                aquí el usuario autenticado.
                            -->
                        </strong>
                    </span>

                    <!-- Logout -->
                    <a class="text-info"
                       th:href="@{/logout}"
                       title="Cerrar sesión">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>


    <!-- ========================================= -->
    <!-- CONTENIDO QUE CAMBIARÁ EN CADA PÁGINA     -->
    <!-- ========================================= -->
    <main class="container flex-grow-1">
        <!--
            Aquí Thymeleaf insertará el contenido
            de cada página.
        -->
        <div th:replace="${contenido}">
            Contenido
        </div>
    </main>


    <!-- ========================================= -->
    <!-- FOOTER                                    -->
    <!-- ========================================= -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <small>
                SpringEduManager
                &copy; 2026
                - Sistema de Gestión Académica
            </small>
        </div>
    </footer>

    <!-- ================================================= -->
    <!-- SCRIPTS GENERALES                                 -->
    <!-- ================================================= -->

    <!--
        Bootstrap se utiliza en toda la aplicación,
        por eso queda directamente en el layout base.
    -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- ================================================= -->
    <!-- SCRIPTS ESPECÍFICOS DE CADA VISTA                 -->
    <!-- ================================================= -->

    <!--
        Aquí Thymeleaf insertará los scripts
        que cada página necesite.

        Por ejemplo:

        evaluaciones.js
        estudiantes.js
        cursos.js
    -->
    <th:block th:replace="${scripts}">
    </th:block>


</body>

</html>
